name: Pilot CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate pilot contents
        run: test -s README.md
